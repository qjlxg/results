name: check_domains

on:
  workflow_dispatch:

  push:
    paths:
      - "check_domains.py"
      - ".github/workflows/check_domains.yml"
      - "domain_candidates.txt"

  schedule:
    # 北京时间每天 03:00
    # GitHub Actions 使用 UTC
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  check-domains:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 拉取仓库
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # 4. 执行检查
      # ======================================================

      - name: Check domains
        run: |
          python check_domains.py

      # ======================================================
      # 5. 提交 CSV (加入 git pull 解决冲突)
      # ======================================================

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add domain_check.csv

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto: update domain availability results [skip ci]" &&
            git pull --rebase origin main &&
            git push
          )
