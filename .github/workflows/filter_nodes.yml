name: filter_nodes

on:
  workflow_dispatch:

  push:
    paths:
      - "filter_nodes.py"
      - ".github/workflows/filter_nodes.yml"
      - "domain_check.csv"

  schedule:
    # 北京时间每天 03:00 (GitHub Actions 使用 UTC 时间，即 19:00)
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  filter-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Filter Script
        run: |
          python filter_nodes.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 确保拉取远端最新变动，避免冲突
          git fetch origin main

          git add nodes_filtered.csv

          # 检查是否有改动需要提交
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto: update filtered nodes and subscriptions [skip ci]" &&
            git pull --rebase origin main || (git rebase --abort && false) &&
            git push origin HEAD:main
          )
