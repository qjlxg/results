name: filter_ips

on:
  push:
    paths:
      - 'filter_ips.py'
      - '.github/workflows/filter_ips.yml'
      - 'ip.txt'
      - 'GeoLite2-Country.mmdb'
  workflow_dispatch:

jobs:
  filter_job:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:

      - name: 1. 拉取代码
        uses: actions/checkout@v4


      - name: 2. 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: 3. 安装依赖
        run: |
          pip install requests geoip2


      - name: 下载 GeoIP 数据库
        run: |
          wget -q https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb


      - name: 4. 运行清理与抽样
        run: |
          python3 filter_ips.py


      - name: 5. 提交结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add bip.txt

          if [ -n "$(git status --porcelain bip.txt)" ]; then
            git commit -m "Auto: 更新IP过滤结果 $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
          else
            echo "没有变化，无需更新。"
          fi
