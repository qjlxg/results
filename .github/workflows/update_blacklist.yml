name: update_blacklist

on:
  
  push:
    branches:
      - main  
    paths:
      - 'update_blacklist.py'
      - '.github/workflows/update_blacklist.yml'

 
  schedule:
    - cron: '0 3 * * *'
  
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 赋予写入仓库的权限，用于自动提交文件

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行更新脚本
        run: |
          python update_blacklist.py

      - name: 检查并提交更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查 blacklist_auto.txt 是否有改动
          git add blacklist_auto.txt
          
          if git diff --staged --quiet; then
            echo "没有检测到 IP 段变动，无需提交。"
          else
            git commit -m "chore: 自动更新云厂商 IP 黑名单 ($(TZ='Asia/Shanghai' date +'%Y-%m-%d'))"
            git push
          fi
