name: collect_seeds

on:
  schedule:
      - cron: '0 0 * * *'   # 每天北京时间早上 8:00 (UTC 0:00)
  workflow_dispatch:
  push:
    paths:
      - 'sources.txt'
      - 'collect_seeds.py'
      - '.github/workflows/collect_seeds.yml'

jobs:
  run-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 必须加，否则无法推送
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行收集脚本
        run: python collect_seeds.py

      - name: 自动提交并推送到仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 正确添加生成的文件
          git add sources_cidr_seed.txt || true
          git add data/fresh_seeds_log.json || true
          git add data/source_stats.csv || true
          
          # 检查是否有实际变更
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update IP seeds [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
