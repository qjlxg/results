name: discover_sources

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'discover_sources.py'
      - '.github/workflows/discover_sources.yml'

  workflow_dispatch:

  schedule:
    - cron: '0 1 * * *'

jobs:
  run-discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行独立发现脚本
        run: python discover_sources.py
        env:
          GITHUB_TOKEN: ${{ secrets.Uninstall }}

      - name: 自动提交更新到 candidates.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 自动运行 discover_sources 脚本更新候选源"
          file_pattern: candidates.txt
          skip_ci: true
